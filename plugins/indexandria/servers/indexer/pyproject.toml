[project]
name = "indexandria-server"
version = "2.1.0"
description = "Lightweight MCP server that crawls web docs into context"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "markdownify>=0.14.1",
    "lxml>=5.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
